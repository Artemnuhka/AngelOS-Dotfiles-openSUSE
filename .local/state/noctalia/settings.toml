config_version = 14

[accessibility]
ui_scale = 1.300000011920929

[backdrop]
blur_intensity = 0.13999999687075615
tint_intensity = 0.039999999105930328

[bar.default]
center = [ "lyrics", "cat", "audio_visualizer", "lyrics_2" ]
end = [ "media", "tray", "notifications", "network", "bluetooth", "volume", "control-center", "clock", "session" ]
font_scale = 0.96999998576939106
margin_ends = 0
radius = 32
scale = 1.1000000089406967
start = [ "launcher", "wallpaper", "workspaces", "lrc" ]

[dock]
icon_size = 27

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 540.0
    cy = 1596.4444580078125
    output = "HDMI-A-1"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
position = "top_right"

    [osd.kinds]
    privacy = false
    volume_input = false

[plugin_settings."goatnath/spotify-lyrics"]
lyrics-panel_placement = "attached"

[plugin_settings."h465855hgg/lyrics"]
lyrics_offset_ms = 1000
lyrics_sources = [
    "lrclib",
    "netease",
    "splayer",
    "qqmusic",
    "kugou",
    "qishui",
    "apple_music",
    "spotify",
    "musixmatch",
    "lyrics",
    "genius"
]
translation_language = "en"

[plugins]
auto_update = "official"
enabled = [ "dotnetrob/cat", "h465855hgg/lyrics" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
app_icon_colorize = true
corner_radius_scale = 1.0500000156462193
font_family = "CozetteVector"

[theme]
builtin = "Gruvbox"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [
        "alacritty",
        "btop",
        "cava",
        "emacs",
        "foot",
        "gtk3",
        "gtk4",
        "ghostty",
        "helix",
        "hyprland",
        "kcolorscheme",
        "kitty",
        "labwc",
        "mango",
        "niri",
        "qt",
        "scroll",
        "starship",
        "umbriel",
        "wezterm"
    ]
    community_ids = [ "telegram", "vscode", "obs" ]
    enable_community_templates = true

[wallpaper.default]
path = "@HOME@/Pictures/Pixel/wallhaven-p9qj59.png"

[wallpaper.last]
path = "@HOME@/Pictures/Pixel/wallhaven-p9qj59.png"

[wallpaper.monitors.DP-1]
path = "@HOME@/Pictures/Pixel/wallhaven-p9qj59.png"

[wallpaper.monitors.HDMI-A-1]
path = "@HOME@/Pictures/Pixel/wallhaven-p9qj59.png"

[widget.audio_visualizer]
bands = 18
centered = false
font_scale = 1.05
reversed = true
scale = 0.75
width = 58

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.lrc]
type = "shin/lrc:lrc"

[widget.lyrics]
type = "goatnath/spotify-lyrics:lyrics"

[widget.lyrics_2]
char_width = 7
font_weight = ""
max_chars = 38
primary_font_size = 14
scale = 1.3500000000000001
secondary_font_size = 6
show_translation = false
text_alignment = "center"
type = "h465855hgg/lyrics:lyrics"

[widget.media]
enabled = false
max_length = 121

[widget.network]
show_label = false