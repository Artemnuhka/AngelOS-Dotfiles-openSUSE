# angelOS {{flavor}} / {{mode}}
[colors.primary]
background = '{{bg}}'
foreground = '{{fg}}'

[colors.cursor]
text = '{{bg}}'
cursor = '{{accent}}'

[colors.vi_mode_cursor]
text = '{{bg}}'
cursor = '{{accent2}}'

[colors.selection]
text = '{{selectText}}'
background = '{{accent}}'

[colors.search.matches]
foreground = '{{bg}}'
background = '{{accent2}}'

[colors.search.focused_match]
foreground = '{{bg}}'
background = '{{accent}}'

[colors.normal]
black   = '{{color0}}'
red     = '{{color1}}'
green   = '{{color2}}'
yellow  = '{{color3}}'
blue    = '{{color4}}'
magenta = '{{color5}}'
cyan    = '{{color6}}'
white   = '{{color7}}'

[colors.bright]
black   = '{{color8}}'
red     = '{{color9}}'
green   = '{{color10}}'
yellow  = '{{color11}}'
blue    = '{{color12}}'
magenta = '{{color13}}'
cyan    = '{{color14}}'
white   = '{{color15}}'
