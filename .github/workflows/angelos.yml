# angelOS checks on every push and pull request that touches the shell, the
# configs, the installer, the check scripts or the package lists:
# the offscreen UI self-test (every settings page, preview scene, search speed,
# the right-click crash guard), `niri validate` of the shipped config, and the
# repository check (scripts/check.sh: syntax, shellcheck, Plugin Studio, the
# installer end to end, Settings → Updates update/failure/restore with its UI).
# Any failing check fails the job.
name: angelOS

on:
  push:
    paths:
      - ".config/**"
      - ".local/**"
      - "install.sh"
      - ".install"
      - "scripts/**"
      - "packages/**"
      - "sddm/**"
      - "Pictures/**"
      - ".github/workflows/angelos.yml"
  pull_request:
    paths:
      - ".config/**"
      - ".local/**"
      - "install.sh"
      - ".install"
      - "scripts/**"
      - "packages/**"
      - "sddm/**"
      - "Pictures/**"
      - ".github/workflows/angelos.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - name: Packages
        run: |
          zypper --non-interactive addrepo --refresh --priority 110 https://download.opensuse.org/repositories/home:/AvengeMedia:/danklinux/openSUSE_Tumbleweed/ angelos-quickshell
          zypper --non-interactive addrepo --refresh --priority 110 https://download.opensuse.org/repositories/home:/neifua:/Noctalia/openSUSE_Tumbleweed/ angelos-noctalia
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive dup --no-recommends
          zypper --non-interactive install --no-recommends git dbus-1-tools dbus-1-daemon diffutils python3 quickshell \
            qt6-declarative-imports qt6-declarative-tools qt6-qt5compat-imports qt6-imageformats \
            libQt6Svg6 qt6-multimedia-imports libQt6Multimedia6 niri libwayland-server0 noctalia google-noto-sans-fonts \
            ShellCheck ripgrep
          FLAVOUR="$(python3 -c 'import sys; print("python%d%d" % sys.version_info[:2])')"
          zypper --non-interactive install --no-recommends "${FLAVOUR}-Pillow" "${FLAVOUR}-numpy"
          test -x /usr/lib64/qt6/bin/qmlformat
      - uses: actions/checkout@v5
      # the checkout belongs to another user than the container's root
      - name: Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: UI self-test (offscreen)
        run: ANGELOS_TEST_TIMEOUT_MS=300000 bash .config/quickshell/angelos/scripts/test-ui.sh .config/quickshell/angelos
      - name: niri validate
        run: |
          T="$(mktemp -d)"; mkdir -p "$T/.config"; cp -r .config/niri "$T/.config/"
          grep -rlF '@HOME@' "$T/.config/niri" | xargs -r sed -i "s#@HOME@#$T#g"
          HOME="$T" XDG_CONFIG_HOME="$T/.config" niri validate -c "$T/.config/niri/config.kdl"
      - name: Repository checks (scripts/check.sh)
        run: REQUIRE_UI=1 bash scripts/check.sh
